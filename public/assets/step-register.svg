<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-label="A signup form on a phone with the details confirmed">
  <defs>
    <linearGradient id="reg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff5f4"/>
      <stop offset="1" stop-color="#fcdedb"/>
    </linearGradient>
    <linearGradient id="reg-btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d63a2a"/>
      <stop offset="1" stop-color="#e8543f"/>
    </linearGradient>
    <filter id="reg-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#7f1d1d" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="800" height="440" fill="url(#reg-bg)"/>

  <!-- soft background shapes -->
  <circle cx="118" cy="92" r="62" fill="#d63a2a" opacity=".07"/>
  <circle cx="702" cy="368" r="88" fill="#d63a2a" opacity=".06"/>
  <path d="M0 372 Q 200 330 400 366 T 800 348 L800 440 L0 440 Z" fill="#d63a2a" opacity=".05"/>

  <!-- phone -->
  <g filter="url(#reg-shadow)">
    <rect x="292" y="54" width="216" height="332" rx="30" fill="#ffffff"/>
    <rect x="292" y="54" width="216" height="332" rx="30" fill="none" stroke="#f1d5d1" stroke-width="2"/>
    <rect x="368" y="70" width="64" height="9" rx="4.5" fill="#e9edf3"/>
  </g>

  <!-- avatar -->
  <circle cx="400" cy="132" r="30" fill="#fde8e5"/>
  <circle cx="400" cy="123" r="11" fill="#d63a2a"/>
  <path d="M382 148 a18 18 0 0 1 36 0 z" fill="#d63a2a"/>

  <!-- form fields -->
  <rect x="324" y="188" width="152" height="26" rx="8" fill="#f4f6f9"/>
  <rect x="336" y="197" width="72" height="8" rx="4" fill="#c3cbd6"/>
  <rect x="324" y="226" width="152" height="26" rx="8" fill="#f4f6f9"/>
  <rect x="336" y="235" width="94" height="8" rx="4" fill="#c3cbd6"/>
  <rect x="324" y="264" width="152" height="26" rx="8" fill="#f4f6f9"/>
  <rect x="336" y="273" width="58" height="8" rx="4" fill="#c3cbd6"/>

  <!-- submit button -->
  <rect x="324" y="308" width="152" height="34" rx="10" fill="url(#reg-btn)"/>
  <rect x="372" y="322" width="56" height="7" rx="3.5" fill="#ffffff" opacity=".92"/>

  <!-- confirmation badge -->
  <g filter="url(#reg-shadow)">
    <circle cx="516" cy="316" r="40" fill="#ffffff"/>
    <circle cx="516" cy="316" r="30" fill="#059669"/>
    <path d="M503 316 l9 9 l18 -18" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 60 second timer motif -->
  <g opacity=".9">
    <circle cx="236" cy="150" r="34" fill="#ffffff"/>
    <circle cx="236" cy="150" r="34" fill="none" stroke="#f0d2ce" stroke-width="2"/>
    <path d="M236 150 L236 128" stroke="#d63a2a" stroke-width="6" stroke-linecap="round"/>
    <path d="M236 150 L253 160" stroke="#d63a2a" stroke-width="6" stroke-linecap="round"/>
    <circle cx="236" cy="150" r="4" fill="#b72e1e"/>
  </g>

  <!-- sparkles -->
  <path d="M596 128 l7 16 l16 7 l-16 7 l-7 16 l-7 -16 l-16 -7 l16 -7 z" fill="#d63a2a" opacity=".5"/>
  <path d="M198 296 l5 11 l11 5 l-11 5 l-5 11 l-5 -11 l-11 -5 l11 -5 z" fill="#d63a2a" opacity=".35"/>
</svg>
