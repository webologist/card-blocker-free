<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-label="Choosing a bank from a list to reveal its blocking helpline">
  <defs>
    <linearGradient id="bb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="bb-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2a0f57" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="800" height="440" fill="url(#bb-bg)"/>

  <circle cx="106" cy="356" r="78" fill="#ffffff" opacity=".05"/>
  <circle cx="700" cy="88" r="62" fill="#ffffff" opacity=".055"/>

  <!-- selection list panel -->
  <g filter="url(#bb-shadow)">
    <rect x="112" y="58" width="392" height="324" rx="26" fill="#1c1035"/>
    <rect x="112" y="58" width="392" height="324" rx="26" fill="none" stroke="#8b6cd9" stroke-width="2" opacity=".5"/>
  </g>

  <!-- search field -->
  <rect x="142" y="90" width="332" height="40" rx="12" fill="#2a1a4d"/>
  <circle cx="170" cy="110" r="9" fill="none" stroke="#a78bfa" stroke-width="3"/>
  <path d="M177 117 l9 9" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
  <rect x="196" y="105" width="120" height="9" rx="4.5" fill="#6d5b9e"/>

  <!-- bank rows -->
  <g>
    <rect x="142" y="146" width="332" height="52" rx="14" fill="#2a1a4d"/>
    <rect x="160" y="160" width="24" height="24" rx="6" fill="#a78bfa" opacity=".65"/>
    <rect x="198" y="164" width="126" height="9" rx="4.5" fill="#7c6bb0"/>
    <rect x="198" y="180" width="76" height="7" rx="3.5" fill="#584a80"/>
  </g>

  <!-- selected bank row -->
  <g>
    <rect x="142" y="208" width="332" height="52" rx="14" fill="#d63a2a"/>
    <rect x="160" y="222" width="24" height="24" rx="6" fill="#ffffff" opacity=".9"/>
    <rect x="198" y="226" width="126" height="9" rx="4.5" fill="#ffffff" opacity=".95"/>
    <rect x="198" y="242" width="76" height="7" rx="3.5" fill="#ffffff" opacity=".65"/>
    <circle cx="446" cy="234" r="14" fill="#ffffff"/>
    <path d="M439 234 l5 5 l10 -11" fill="none" stroke="#d63a2a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g>
    <rect x="142" y="270" width="332" height="52" rx="14" fill="#2a1a4d"/>
    <rect x="160" y="284" width="24" height="24" rx="6" fill="#a78bfa" opacity=".65"/>
    <rect x="198" y="288" width="126" height="9" rx="4.5" fill="#7c6bb0"/>
    <rect x="198" y="304" width="76" height="7" rx="3.5" fill="#584a80"/>
  </g>

  <rect x="142" y="334" width="332" height="18" rx="9" fill="#2a1a4d" opacity=".6"/>

  <!-- resulting helpline card -->
  <g filter="url(#bb-shadow)">
    <rect x="536" y="128" width="216" height="184" rx="24" fill="#ffffff"/>
  </g>

  <!-- bank building glyph -->
  <g transform="translate(586 156)">
    <path d="M58 0 L116 30 H0 z" fill="#4c1d95"/>
    <rect x="8" y="38" width="14" height="46" rx="3" fill="#4c1d95"/>
    <rect x="36" y="38" width="14" height="46" rx="3" fill="#4c1d95"/>
    <rect x="64" y="38" width="14" height="46" rx="3" fill="#4c1d95"/>
    <rect x="92" y="38" width="14" height="46" rx="3" fill="#4c1d95"/>
    <rect x="0" y="90" width="116" height="12" rx="4" fill="#4c1d95"/>
  </g>

  <!-- helpline pill -->
  <rect x="562" y="272" width="164" height="24" rx="12" fill="#d63a2a"/>
  <circle cx="580" cy="284" r="7" fill="#ffffff"/>
  <rect x="596" y="280" width="112" height="8" rx="4" fill="#ffffff" opacity=".9"/>
</svg>
