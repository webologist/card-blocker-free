<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-label="A family member being added as an emergency contact">
  <defs>
    <linearGradient id="fam-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1fdf7"/>
      <stop offset="1" stop-color="#d3f2e2"/>
    </linearGradient>
    <filter id="fam-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#065f46" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="800" height="440" fill="url(#fam-bg)"/>

  <circle cx="108" cy="106" r="66" fill="#059669" opacity=".08"/>
  <circle cx="712" cy="352" r="80" fill="#059669" opacity=".07"/>

  <!-- connecting arc between the two people -->
  <path d="M262 214 Q 400 138 538 214" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 16" opacity=".55"/>

  <!-- primary person card -->
  <g filter="url(#fam-shadow)">
    <rect x="150" y="182" width="224" height="176" rx="24" fill="#ffffff"/>
  </g>
  <circle cx="262" cy="238" r="38" fill="#d1fae5"/>
  <circle cx="262" cy="226" r="14" fill="#059669"/>
  <path d="M239 260 a23 23 0 0 1 46 0 z" fill="#059669"/>
  <rect x="206" y="296" width="112" height="11" rx="5.5" fill="#dfe6ee"/>
  <rect x="228" y="320" width="68" height="9" rx="4.5" fill="#eef2f7"/>

  <!-- family member card -->
  <g filter="url(#fam-shadow)">
    <rect x="426" y="182" width="224" height="176" rx="24" fill="#ffffff"/>
  </g>
  <circle cx="538" cy="238" r="38" fill="#fde8e5"/>
  <circle cx="538" cy="226" r="14" fill="#d63a2a"/>
  <path d="M515 260 a23 23 0 0 1 46 0 z" fill="#d63a2a"/>
  <rect x="482" y="296" width="112" height="11" rx="5.5" fill="#dfe6ee"/>
  <rect x="504" y="320" width="68" height="9" rx="4.5" fill="#eef2f7"/>

  <!-- add badge on the family member -->
  <g filter="url(#fam-shadow)">
    <circle cx="612" cy="204" r="30" fill="#059669"/>
    <path d="M612 190 L612 218 M598 204 L626 204" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- heart linking them -->
  <path d="M400 128 c-6 -14 -28 -14 -28 3 c0 14 18 24 28 33 c10 -9 28 -19 28 -33 c0 -17 -22 -17 -28 -3 z" fill="#d63a2a" opacity=".85"/>

  <!-- reassurance dots -->
  <circle cx="122" cy="300" r="8" fill="#059669" opacity=".3"/>
  <circle cx="678" cy="126" r="10" fill="#059669" opacity=".28"/>
</svg>
